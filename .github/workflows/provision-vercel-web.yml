name: Provision Vercel Web

on:
  push:
    branches:
      - ops/vercel-web-provision

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      TEAM_ID: team_TUjl46r3LAWd2rBN1X3bhbmD
      TEAM_SLUG: leoo1992s-projects
      PROJECT_NAME: portfolio-novo-leonardo-web
      API_URL: https://portfolio-novo-leonardo-api.vercel.app
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ALT: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_ALT2: ${{ secrets.VERCEL_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Vercel credential
        id: auth
        shell: bash
        run: |
          TOKEN="${VERCEL_TOKEN_PRIMARY:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${VERCEL_TOKEN_ALT:-}"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${VERCEL_TOKEN_ALT2:-}"; fi

          if [ -z "$TOKEN" ]; then
            echo "No Vercel CI token is configured in GitHub Actions secrets."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::add-mask::$TOKEN"
          echo "VERCEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Create or resolve Vercel project
        if: steps.auth.outputs.available == 'true'
        id: project
        shell: bash
        run: |
          cat > /tmp/create-project.json <<'JSON'
          {
            "name": "portfolio-novo-leonardo-web",
            "framework": "nextjs",
            "gitRepository": {
              "repo": "leoo1992/Portfolio_Novo_Leonardo",
              "type": "github"
            },
            "rootDirectory": "apps/web"
          }
          JSON

          CODE=$(curl -sS -o /tmp/project.json -w "%{http_code}" \
            -X POST "https://api.vercel.com/v11/projects?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/create-project.json)

          if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
            PROJECT_ID=$(jq -r '.id' /tmp/project.json)
          elif [ "$CODE" = "409" ] || [ "$CODE" = "400" ]; then
            curl -fsS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$PROJECT_NAME?teamId=$TEAM_ID" \
              -o /tmp/project-existing.json
            PROJECT_ID=$(jq -r '.id' /tmp/project-existing.json)
          else
            echo "Vercel project creation failed with HTTP $CODE"
            jq '{error: .error}' /tmp/project.json || true
            exit 1
          fi

          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "Unable to resolve Vercel project ID."
            exit 1
          fi

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved Vercel project: $PROJECT_NAME ($PROJECT_ID)"

      - name: Configure backend URL
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          PROJECT_ID="${{ steps.project.outputs.project_id }}"
          BODY=$(jq -n --arg value "$API_URL" '{
            key: "API_INTERNAL_URL",
            value: $value,
            type: "plain",
            target: ["production", "preview"]
          }')

          CODE=$(curl -sS -o /tmp/env.json -w "%{http_code}" \
            -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID&upsert=true" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "$BODY")

          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "Environment configuration failed with HTTP $CODE"
            jq '{error: .error, failed: .failed}' /tmp/env.json || true
            exit 1
          fi

          echo "API_INTERNAL_URL configured for production and preview."

      - name: Link frontend directory
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p apps/web/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "${{ steps.project.outputs.project_id }}" > apps/web/.vercel/project.json

      - name: Deploy frontend to production
        if: steps.auth.outputs.available == 'true'
        id: deploy
        shell: bash
        run: |
          URL=$(npx --yes vercel@latest deploy \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$TEAM_SLUG" \
            --cwd apps/web)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production URL: $URL"

      - name: Summary
        shell: bash
        run: |
          if [ "${{ steps.auth.outputs.available }}" != "true" ]; then
            echo "VERCEL_CI_TOKEN_MISSING"
            exit 0
          fi

          echo "Project: $PROJECT_NAME"
          echo "Project ID: ${{ steps.project.outputs.project_id }}"
          echo "Deployment: ${{ steps.deploy.outputs.url }}"
