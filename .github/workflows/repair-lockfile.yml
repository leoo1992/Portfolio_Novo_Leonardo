name: Repair npm lockfile

on:
  push:
    branches: [fix/ci-node24-20261008]

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.repository == 'leoo1992/Portfolio_Novo_Leonardo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild dependency lockfile from workspace manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate reproducible installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: synchronize npm lockfile with workspace dependencies"
            git push origin HEAD:fix/ci-node24-20261008
          fi
